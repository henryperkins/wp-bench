# WP-Bench Configuration
# Copy to wp-bench.yaml and customize. API keys loaded from .env file.

dataset:
  source: local          # 'local' or 'huggingface'
  name: wp-core-v1       # suite name or HF dataset path

# Multiple models to benchmark (runs sequentially, outputs comparison table)
models:
  # OpenAI
  - name: gpt-4o
  - name: gpt-4o-mini
  # Google Gemini
  - name: gemini/gemini-2.5-pro
  - name: gemini/gemini-2.5-flash
  # Anthropic Claude
  - name: claude-sonnet-4-20250514
  - name: claude-opus-4-5-20251101

# Stream completions to measure serving telemetry: ttft_ms and
# output_window_ms land in each record's `usage`, and run metadata gains
# percentiles plus the sample count behind each. Diagnostic only —
# telemetry never affects a score. Off by default because streaming changes
# the provider request path; left off, those fields stay null rather than
# being approximated from total latency. Every entry above must use the
# same value, or a multi-model run would compare request paths as well as
# models (mixed configs are rejected at load time).
#   - name: gpt-4o
#     stream: true

# Or use single model (legacy format):
# model:
#   name: gpt-4o
#   # stream: false
#   # Retry policy for transient provider errors (rate limit, timeout,
#   # connection, 5xx). Deterministic errors are never retried.
#   # max_retries: 3
#   # retry_min_seconds: 1.0
#   # retry_max_seconds: 30.0
#   # retry_on_rate_limit: true
#   # retry_on_timeout: true

# WordPress runtime grader
grader:
  kind: docker
  wp_env_dir: ./runtime  # path to wp-env project
  # timeout_seconds: 90        # hard cap per runtime execution; a timed-out
  #                            # test scores 0.0 and is marked timeout: true
  # setup_timeout_seconds: 600 # hard cap for environment setup (wp-env start);
  #                            # setup timeout aborts the run with a clear error

# Run configuration
run:
  suite: wp-core-v1
  # limit: 10            # limit tests per model (null = all); limited runs
  #                      # use seeded stratified selection across categories
  # seed: 1337           # selection seed (same seed = same subset)
  # test_ids: []         # optional explicit test IDs to run
  # dry_run: false       # load/filter tests without calling models
  # Execution-test isolation. 'reset_per_test' (default) resets WordPress
  # to a clean baseline before every execution test and runs them serially.
  # 'none' opts out and allows execution_concurrency > 1, but tests then
  # share mutable WordPress state (not valid for official benchmark runs).
  # execution_isolation: reset_per_test
  # execution_concurrency: 1
  # Diagnostic-only switches. Official leaderboard runs must grade every
  # dimension; skipping either invalidates a run for comparison purposes.
  # skip_runtime: false  # skip runtime assertions (static checks only)
  # skip_static: false   # skip static checks (runtime assertions only)
  # Record per-test errors (provider blips, harness exceptions) and keep
  # going instead of aborting the run. Errored tests carry an `error` object
  # in results, are excluded from score aggregates, and are listed in
  # metadata.errored_test_ids. A run where every test errors still aborts
  # (that is systemic failure, not per-test). Diagnostic runs only: official
  # leaderboard runs must grade every selected test.
  # continue_on_error: false

# Output paths
output:
  path: output/results.json
  jsonl_path: output/results.jsonl
